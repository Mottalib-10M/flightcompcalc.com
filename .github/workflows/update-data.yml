name: Data update and deploy

# Chaque lundi vers 6 h UTC : relit la liste des aéroports d'OurAirports (mise à jour quotidienne côté
# source) et les cours du DTS publiés par le FMI (plafonds de la Convention de Montréal). Les règles de
# droit ne changent pas par script (CONTRIBUTING-DATA.md). Puis tests, build et publication sur GitHub Pages.
on:
  schedule:
    - cron: "0 6 * * 1"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Read OurAirports and IMF (scheduled and manual runs)
        if: github.event_name != 'push'
        run: python3 scripts/update-data.py

      - name: Tests
        run: npx vitest run

      - name: Build
        run: npm run build

      - name: Commit the new readings
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/airports.json src/data/airports-top.json src/data/airports-meta.json src/data/params-2026.json
          git diff --cached --quiet || (git commit -m "Aéroports et DTS relus le $(date -u +%F)" && git push)

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
